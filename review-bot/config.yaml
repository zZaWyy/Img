  - match: "Pecado 24H"
    city: "Santa Ponsa"
    keywords:
      - "delivery 24 horas"
      - "take away"
    notes: "PENDIENTE: keywords oficiales sin definir. Es delivery/take away: agradecer también los pedidos a domicilio."

  - match: "Playas del Rey"
    city: "Santa Ponsa"
    keywords:
      - "hotel en Santa Ponsa"
      - "buena ubicación"
      - "cerca de la playa"
      - "hotel céntrico"
      - "desayuno incluido"
      - "piscina"
    notes: >
      Es un HOTEL, no un restaurante: responder como el equipo del hotel.
      Su restaurante/bar es N76 (Sports Pool Bar: smash burger, thin pizza,
      baguettes y sandwiches, cócteles y cerveza, ambiente relajado junto a
      la piscina); si la reseña habla de la comida o del bar, se puede
      mencionar N76 con naturalidad.

