      - "pasta fresca"
      - "tiramisú casero"
      - "cócteles"
      - "terraza con vistas al mar"
      - "ambiente familiar"
      - "cocina tradicional italiana"
      - "abierto todo el año"
    notes: ""

  - match: "Mestiza"
    city: "Santa Ponsa"
    keywords:
      - "steak house"
      - "prime steak"
      - "great burger"
      - "pizza fina"
      - "cócteles"
      - "terraza al aire libre"
      - "sports bar"
    notes: ""

  - match: "Virtus Smash Burger"
    city: "Santa Ponsa"
    keywords:
      - "smash burgers"
      - "sports bar"
      - "desayunos y bocadillos"
      - "cócteles y cerveza"
      - "terraza al aire libre"
      - "comida rápida de calidad"
      - "abierto 24 horas"
      - "abierto todo el año"
