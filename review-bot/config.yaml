# Configuración del bot de respuestas a reseñas — Unicum Group
# Edita este archivo: es el único que hay que tocar en el día a día.

timezone: Europe/Madrid

# Ventana horaria en la que el bot publica respuestas (hora local).
# Fuera de esta ventana el bot no publica nada, aunque haya reseñas pendientes.
reply_window:
  start_hour: 10   # desde las 10:00
  end_hour: 21     # hasta las 21:00

# Desfase mínimo entre que se publica la reseña y que el bot responde.
min_delay_hours: 2

# No responder reseñas más antiguas que esto (evita que en la primera
# ejecución el bot responda de golpe a reseñas de hace meses).
max_review_age_days: 30

# Solo se responden reseñas con esta puntuación o superior.
# Las de 1-3 estrellas NUNCA se tocan: se responden a mano.
min_star_rating: 4

# Máximo de respuestas publicadas por ejecución (freno de seguridad).
max_replies_per_run: 5

llm:
  provider: gemini          # gemini (gratis) | anthropic
  model: gemini-2.5-flash   # para anthropic: claude-sonnet-5

# Fichas EXCLUIDAS: el bot nunca las toca, aunque su nombre coincida con
# un restaurante configurado. Se puede poner el código de tienda o un
# trozo del nombre. (Además, cualquier ficha que Google marque como
# duplicada se descarta automáticamente.)
exclude:
  - "04689908530062317521"   # Madre Santa Pizza — ficha DUPLICADA
  - "05822270310761289432"   # Pecado 24H Delivery Service — ficha DUPLICADA
  - "Central UNICUM"         # oficina central, no es un restaurante

# Datos por restaurante. "match" debe coincidir (parcialmente, sin
# mayúsculas) con el nombre de la ficha en Google Business Profile.
# Keywords: las oficiales del grupo. El bot usa COMO MUCHO 1-2 por
# respuesta y solo cuando encajan de forma natural.
restaurants:

  # ---------- SANTA PONSA ----------

  - match: "Mercader del Mar"
    city: "Santa Ponsa"
    keywords:
      - "restaurante mediterráneo"
      - "paellas"
      - "mariscos frescos"
      - "pescados"
      - "terraza con vistas al mar"
      - "vinos y cava"
      - "menú para niños"
      - "ambiente familiar"
      - "celebraciones y eventos"
      - "abierto todo el año"
    notes: ""

  - match: "Alma Beach"
    city: "Santa Ponsa"
    keywords:
      - "steakhouse"
      - "beach bar"
      - "cócteles"
      - "terraza al aire libre"
      - "paellas"
      - "pizzas artesanales"
      - "cocina mediterránea"
      - "abierto todo el año"
    notes: ""

  - match: "Amira Great Kebab"
    city: "Santa Ponsa"
    keywords:
      - "kebab gourmet"
      - "dürum"
      - "pizza"
      - "wok oriental"
      - "poké bowl"
      - "helados y copas heladas"
      - "take away"
      - "reparto a domicilio en Calvià"
      - "abierto 24 horas"
      - "abierto todo el año"
    notes: "Abierto 24 horas. Agradecer también los pedidos take away / a domicilio."

  - match: "Balcón de María"
