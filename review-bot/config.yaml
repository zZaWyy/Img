      - "hamburguesa gourmet en Santa Ponsa"
      - "prime steak"
      - "pizza americana"
    notes: ""

  - match: "Pecado 24H"
    city: "Santa Ponsa"
    keywords:
      - "delivery 24 horas en Santa Ponsa"
